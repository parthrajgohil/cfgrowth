<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <text x="100" y="170" font-size="26" font-weight="700" fill="#1F5FAE">A BLE MEDICAL DEVICE PLAYBOOK</text>
    <text x="100" y="260" font-size="40" fill="#52606D">The meter works.</text>
    <text x="100" y="315" font-size="40" fill="#52606D">The app works.</text>
    <text x="100" y="430" font-size="80" font-weight="700" fill="#1F2933">The reading still</text>
    <text x="100" y="520" font-size="80" font-weight="700" fill="#1F5FAE">goes missing.</text>
    <!-- meter -->
    <rect x="130" y="650" width="220" height="300" rx="30" fill="none" stroke="#1F5FAE" stroke-width="5"/>
    <rect x="165" y="690" width="150" height="100" rx="10" fill="none" stroke="#1F5FAE" stroke-width="4"/>
    <text x="240" y="757" text-anchor="middle" font-size="40" font-weight="700" fill="#1F5FAE">112</text>
    <circle cx="240" cy="870" r="32" fill="none" stroke="#1F5FAE" stroke-width="4"/>
    <text x="240" y="1000" text-anchor="middle" font-size="30" fill="#52606D">Firmware</text>
    <!-- phone -->
    <rect x="760" y="620" width="190" height="340" rx="30" fill="none" stroke="#1F5FAE" stroke-width="5"/>
    <line x1="820" y1="650" x2="890" y2="650" stroke="#1F5FAE" stroke-width="4" stroke-linecap="round"/>
    <line x1="790" y1="720" x2="920" y2="720" stroke="#E4E7EB" stroke-width="12" stroke-linecap="round"/>
    <line x1="790" y1="760" x2="890" y2="760" stroke="#E4E7EB" stroke-width="12" stroke-linecap="round"/>
    <line x1="790" y1="800" x2="905" y2="800" stroke="#E4E7EB" stroke-width="12" stroke-linecap="round"/>
    <text x="855" y="1000" text-anchor="middle" font-size="30" fill="#52606D">App</text>
    <!-- the gap -->
    <line x1="365" y1="800" x2="490" y2="800" stroke="#1F5FAE" stroke-width="5" stroke-dasharray="16 12"/>
    <line x1="620" y1="800" x2="745" y2="800" stroke="#1F5FAE" stroke-width="5" stroke-dasharray="16 12"/>
    <circle cx="555" cy="800" r="55" fill="#FDEBD7" stroke="#F26522" stroke-width="5"/>
    <text x="555" y="822" text-anchor="middle" font-size="60" font-weight="700" fill="#F26522">?</text>
    <text x="555" y="900" text-anchor="middle" font-size="28" font-weight="700" fill="#F26522">the gap</text>
    <text x="100" y="1100" font-size="36" fill="#1F2933">5 things to lock before</text>
    <text x="100" y="1150" font-size="36" fill="#1F2933">either team writes code.</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
