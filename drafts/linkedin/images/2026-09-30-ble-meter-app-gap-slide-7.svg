<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <circle cx="150" cy="190" r="50" fill="#1F5FAE"/>
    <text x="150" y="208" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">5</text>
    <text x="230" y="200" font-size="28" font-weight="700" fill="#1F5FAE">VERSIONS</text>
    <text x="100" y="360" font-size="72" font-weight="700" fill="#1F2933">Old firmware meets</text>
    <text x="100" y="450" font-size="72" font-weight="700" fill="#1F5FAE">the new app.</text>
    <text x="100" y="560" font-size="36" fill="#1F2933">The app updates through the store</text>
    <text x="100" y="614" font-size="36" fill="#1F2933">in days. Meter firmware may never</text>
    <text x="100" y="668" font-size="36" fill="#1F2933">update at all.</text>
    <text x="100" y="744" font-size="36" fill="#52606D">So every app release has to talk to</text>
    <text x="100" y="798" font-size="36" fill="#52606D">every firmware version still in use.</text>
    <!-- agree on (highlight) -->
    <rect x="100" y="920" width="880" height="210" rx="20" fill="#FDEBD7" stroke="#F26522" stroke-width="4"/>
    <text x="140" y="978" font-size="26" font-weight="700" fill="#F26522">AGREE ON</text>
    <text x="140" y="1034" font-size="34" fill="#1F2933">A versioned protocol, and an app ×</text>
    <text x="140" y="1084" font-size="34" fill="#1F2933">firmware test matrix for each release.</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
