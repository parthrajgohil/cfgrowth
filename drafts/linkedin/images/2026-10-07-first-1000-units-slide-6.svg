<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <circle cx="150" cy="190" r="50" fill="#1F5FAE"/>
    <text x="150" y="208" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">5</text>
    <text x="230" y="200" font-size="28" font-weight="700" fill="#1F5FAE">EMC PRE-COMPLIANCE</text>
    <text x="100" y="360" font-size="72" font-weight="700" fill="#1F2933">Scan before</text>
    <text x="100" y="450" font-size="72" font-weight="700" fill="#1F5FAE">the lab does.</text>
    <text x="100" y="560" font-size="36" fill="#1F2933">Formal EMC lab time is booked ahead.</text>
    <text x="100" y="614" font-size="36" fill="#1F2933">Fail it after the PCB is frozen, and</text>
    <text x="100" y="668" font-size="36" fill="#1F2933">the fix can mean a board respin.</text>
    <text x="100" y="722" font-size="36" fill="#1F2933">An in-house pre-scan finds the noisy</text>
    <text x="100" y="776" font-size="36" fill="#1F2933">trace while a fix is still cheap.</text>
    <text x="100" y="840" font-size="26" fill="#52606D">Typical targets: FCC Part 15 (US), IEC 60601-1-2</text>
    <text x="100" y="876" font-size="26" fill="#52606D">(medical EMC), IEC 61000-6 series (industrial).</text>
    <!-- lock (highlight) -->
    <rect x="100" y="920" width="880" height="210" rx="20" fill="#FDEBD7" stroke="#F26522" stroke-width="4"/>
    <text x="140" y="978" font-size="26" font-weight="700" fill="#F26522">LOCK</text>
    <text x="140" y="1034" font-size="34" fill="#1F2933">Target standards, pre-scan results,</text>
    <text x="140" y="1084" font-size="34" fill="#1F2933">and margin before booking the lab.</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
