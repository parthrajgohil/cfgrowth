<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <text x="100" y="200" font-size="28" font-weight="700" fill="#1F5FAE">THE PROJECT</text>
    <text x="100" y="330" font-size="72" font-weight="700" fill="#1F2933">A CNC drill,</text>
    <text x="100" y="420" font-size="72" font-weight="700" fill="#1F5FAE">an operator HMI.</text>
    <text x="100" y="530" font-size="36" fill="#1F2933">For a European industrial automation</text>
    <text x="100" y="584" font-size="36" fill="#1F2933">company, we built the HMI for a CNC</text>
    <text x="100" y="638" font-size="36" fill="#1F2933">drilling machine. Operators can:</text>
    <g fill="#1F5FAE">
      <circle cx="116" cy="716" r="10"/>
      <circle cx="116" cy="782" r="10"/>
      <circle cx="116" cy="848" r="10"/>
      <circle cx="116" cy="914" r="10"/>
    </g>
    <text x="150" y="728" font-size="34" fill="#1F2933">Pick the machine make and part number</text>
    <text x="150" y="794" font-size="34" fill="#1F2933">Set and read 3-axis coordinates</text>
    <text x="150" y="860" font-size="34" fill="#1F2933">Upload files and code over Wi-Fi</text>
    <text x="150" y="926" font-size="34" fill="#1F2933">Monitor the machine's activity</text>
    <rect x="100" y="990" width="880" height="160" rx="20" fill="#FDEBD7" stroke="#F26522" stroke-width="4"/>
    <text x="140" y="1046" font-size="26" font-weight="700" fill="#F26522">STACK</text>
    <text x="140" y="1102" font-size="34" fill="#1F2933">HTML/JS screen, Flask, Raspberry Pi</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
