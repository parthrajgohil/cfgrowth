<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <text x="100" y="200" font-size="28" font-weight="700" fill="#1F5FAE">LESSON FROM A HOME HEALTH HUB</text>
    <text x="100" y="330" font-size="76" font-weight="700" fill="#1F2933">The patient won't</text>
    <text x="100" y="424" font-size="76" font-weight="700" fill="#1F5FAE">fix the Wi-Fi.</text>
    <text x="100" y="524" font-size="36" fill="#1F2933">So the hub has to look after itself.</text>
    <!-- devices -->
    <g fill="#FFFFFF" stroke="#1F5FAE" stroke-width="3">
      <rect x="100" y="680" width="250" height="70" rx="14"/>
      <rect x="100" y="775" width="250" height="70" rx="14"/>
      <rect x="100" y="870" width="250" height="70" rx="14"/>
    </g>
    <text x="225" y="724" text-anchor="middle" font-size="26" fill="#1F2933">Oxygen monitor</text>
    <text x="225" y="819" text-anchor="middle" font-size="26" fill="#1F2933">Weighing scale</text>
    <text x="225" y="914" text-anchor="middle" font-size="26" fill="#1F2933">Glucose meter</text>
    <g stroke="#1F5FAE" stroke-width="4">
      <line x1="350" y1="715" x2="406" y2="715"/>
      <line x1="350" y1="810" x2="406" y2="810"/>
      <line x1="350" y1="905" x2="406" y2="905"/>
    </g>
    <g fill="#1F5FAE">
      <polygon points="404,705 420,715 404,725"/>
      <polygon points="404,800 420,810 404,820"/>
      <polygon points="404,895 420,905 404,915"/>
    </g>
    <!-- hub -->
    <rect x="420" y="680" width="220" height="260" rx="18" fill="#1F5FAE"/>
    <text x="530" y="800" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">Hub</text>
    <text x="530" y="846" text-anchor="middle" font-size="26" fill="#FFFFFF">stores first</text>
    <!-- cloud -->
    <rect x="760" y="700" width="220" height="220" rx="18" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="4"/>
    <text x="870" y="796" text-anchor="middle" font-size="34" font-weight="700" fill="#1F2933">Cloud</text>
    <text x="870" y="840" text-anchor="middle" font-size="26" fill="#52606D">+ app</text>
    <!-- links -->
    <line x1="640" y1="770" x2="746" y2="770" stroke="#1F5FAE" stroke-width="5"/>
    <polygon points="744,758 760,770 744,782" fill="#1F5FAE"/>
    <text x="700" y="752" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5FAE">Wi-Fi</text>
    <line x1="640" y1="860" x2="746" y2="860" stroke="#F26522" stroke-width="5" stroke-dasharray="12 8"/>
    <polygon points="744,848 760,860 744,872" fill="#F26522"/>
    <text x="700" y="902" text-anchor="middle" font-size="24" font-weight="700" fill="#F26522">cellular</text>
    <text x="100" y="1110" font-size="28" fill="#52606D">Swipe for five design lessons -&gt;</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
