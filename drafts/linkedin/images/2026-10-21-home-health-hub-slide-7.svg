<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <circle cx="150" cy="190" r="50" fill="#1F5FAE"/>
    <text x="150" y="208" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">5</text>
    <text x="230" y="200" font-size="28" font-weight="700" fill="#1F5FAE">CELLULAR BUDGET</text>
    <text x="100" y="360" font-size="72" font-weight="700" fill="#1F2933">Cellular data</text>
    <text x="100" y="450" font-size="72" font-weight="700" fill="#1F5FAE">costs money.</text>
    <text x="100" y="560" font-size="36" fill="#1F2933">The backup link carries what matters</text>
    <text x="100" y="614" font-size="36" fill="#1F2933">right now. Everything else can wait.</text>
    <!-- over cellular -->
    <rect x="100" y="690" width="420" height="300" rx="20" fill="#1F5FAE"/>
    <text x="140" y="750" font-size="26" font-weight="700" fill="#FFFFFF">OVER CELLULAR</text>
    <line x1="140" y1="774" x2="480" y2="774" stroke="#FFFFFF" stroke-width="2"/>
    <text x="140" y="834" font-size="30" fill="#FFFFFF">Readings</text>
    <text x="140" y="884" font-size="30" fill="#FFFFFF">Alerts</text>
    <text x="140" y="934" font-size="30" fill="#FFFFFF">Remote commands</text>
    <!-- wait for wifi -->
    <rect x="560" y="690" width="420" height="300" rx="20" fill="#FDEBD7" stroke="#F26522" stroke-width="4"/>
    <text x="600" y="750" font-size="26" font-weight="700" fill="#F26522">WAIT FOR WI-FI</text>
    <line x1="600" y1="774" x2="940" y2="774" stroke="#F26522" stroke-width="2"/>
    <text x="600" y="834" font-size="30" fill="#1F2933">Debug logs</text>
    <text x="600" y="884" font-size="30" fill="#1F2933">Large updates</text>
    <text x="600" y="934" font-size="30" fill="#1F2933">Bulk diagnostics</text>
    <text x="100" y="1090" font-size="34" fill="#1F2933">Decide this in the design,</text>
    <text x="100" y="1140" font-size="34" fill="#1F2933">not after the first data bill.</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
