      <rect x="705" y="710" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="760" y="710" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="815" y="710" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="870" y="710" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="925" y="710" width="44" height="44" rx="6" fill="#E4E7EB"/>
      <rect x="100" y="765" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="155" y="765" width="44" height="44" rx="6" fill="#E4E7EB"/>
      <rect x="210" y="765" width="44" height="44" rx="6" fill="#E4E7EB"/>
      <rect x="265" y="765" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="320" y="765" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="375" y="765" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="430" y="765" width="44" height="44" rx="6" fill="#E4E7EB"/>
