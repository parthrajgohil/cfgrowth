<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <circle cx="150" cy="190" r="50" fill="#1F5FAE"/>
    <text x="150" y="208" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">2</text>
    <text x="230" y="200" font-size="28" font-weight="700" fill="#1F5FAE">DATA</text>
    <text x="100" y="360" font-size="72" font-weight="700" fill="#1F2933">Ask the car</text>
    <text x="100" y="450" font-size="72" font-weight="700" fill="#1F5FAE">what it supports.</text>
    <text x="100" y="550" font-size="36" fill="#1F2933">Not every car reports every PID.</text>
    <text x="100" y="604" font-size="36" fill="#1F2933">Request PID 00 first: the car answers</text>
    <text x="100" y="658" font-size="36" fill="#1F2933">with a map of the PIDs it supports.</text>
    <!-- bitmap grid: 32 PIDs (illustrative) -->
    <g>
      <rect x="100" y="710" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="155" y="710" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="210" y="710" width="44" height="44" rx="6" fill="#1F5FAE"/>
