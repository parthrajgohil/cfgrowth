      <rect x="650" y="765" width="44" height="44" rx="6" fill="#E4E7EB"/>
      <rect x="705" y="765" width="44" height="44" rx="6" fill="#1F5FAE"/>
      <rect x="760" y="765" width="44" height="44" rx="6" fill="#E4E7EB"/>
      <rect x="815" y="765" width="44" height="44" rx="6" fill="#E4E7EB"/>
      <rect x="870" y="765" width="44" height="44" rx="6" fill="#E4E7EB"/>
      <rect x="925" y="765" width="44" height="44" rx="6" fill="#1F5FAE"/>
    </g>
    <rect x="100" y="850" width="28" height="28" rx="4" fill="#1F5FAE"/>
    <text x="142" y="874" font-size="26" fill="#1F2933">supported</text>
    <rect x="360" y="850" width="28" height="28" rx="4" fill="#E4E7EB"/>
    <text x="402" y="874" font-size="26" fill="#1F2933">not on this car</text>
    <!-- highlight -->
    <rect x="100" y="940" width="880" height="210" rx="14" fill="#FDEBD7" stroke="#F26522" stroke-width="4"/>
    <text x="130" y="1002" font-size="32" font-weight="700" fill="#1F2933">Build the dashboard around the answer.</text>
    <text x="130" y="1052" font-size="32" fill="#1F2933">Hide what the car can't give you.</text>
    <text x="130" y="1102" font-size="32" fill="#1F2933">Manufacturer-specific data is extra work.</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
