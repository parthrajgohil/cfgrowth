<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <text x="100" y="180" font-size="28" font-weight="700" fill="#1F5FAE">MACHINE VISION · PCB INSPECTION</text>
    <text x="100" y="320" font-size="72" font-weight="700" fill="#1F2933">The model is rarely</text>
    <text x="100" y="410" font-size="72" font-weight="700" fill="#1F2933">the hard part.</text>
    <text x="100" y="505" font-size="36" font-weight="700" fill="#1F5FAE">Getting the same photo every time is.</text>
    <!-- pipeline: four stages, first three are imaging work -->
    <rect x="100" y="600" width="880" height="96" rx="14" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="3"/>
    <text x="140" y="660" font-size="34" font-weight="700" fill="#1F2933">Define the defect</text>
    <text x="940" y="660" text-anchor="end" font-size="26" fill="#52606D">spec</text>
    <line x1="540" y1="696" x2="540" y2="730" stroke="#1F5FAE" stroke-width="3"/>
    <polygon points="530,724 550,724 540,740" fill="#1F5FAE"/>
    <rect x="100" y="740" width="880" height="96" rx="14" fill="#FDEBD7" stroke="#F26522" stroke-width="4"/>
    <text x="140" y="800" font-size="34" font-weight="700" fill="#1F2933">Lock the camera and light</text>
    <text x="940" y="800" text-anchor="end" font-size="26" fill="#1F2933">imaging</text>
    <line x1="540" y1="836" x2="540" y2="870" stroke="#1F5FAE" stroke-width="3"/>
    <polygon points="530,864 550,864 540,880" fill="#1F5FAE"/>
    <rect x="100" y="880" width="880" height="96" rx="14" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="3"/>
    <text x="140" y="940" font-size="34" font-weight="700" fill="#1F2933">Collect images on the station</text>
    <text x="940" y="940" text-anchor="end" font-size="26" fill="#52606D">data</text>
    <line x1="540" y1="976" x2="540" y2="1010" stroke="#1F5FAE" stroke-width="3"/>
    <polygon points="530,1004 550,1004 540,1020" fill="#1F5FAE"/>
    <rect x="100" y="1020" width="880" height="96" rx="14" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="3"/>
    <text x="140" y="1080" font-size="34" font-weight="700" fill="#52606D">Train the model</text>
    <text x="940" y="1080" text-anchor="end" font-size="26" fill="#52606D">last</text>
    <text x="100" y="1180" font-size="26" fill="#52606D">Lessons from a PCB coating inspection project. Swipe -&gt;</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
