<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <text x="100" y="180" font-size="28" font-weight="700" fill="#1F5FAE">TAKEAWAY</text>
    <text x="100" y="310" font-size="80" font-weight="700" fill="#1F2933">Lock the photo.</text>
    <text x="100" y="405" font-size="80" font-weight="700" fill="#1F5FAE">Then train.</text>
    <line x1="100" y1="470" x2="980" y2="470" stroke="#E4E7EB" stroke-width="3"/>
    <circle cx="130" cy="539" r="26" fill="#1F5FAE"/>
    <text x="130" y="550" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
    <text x="180" y="550" font-size="30" fill="#1F2933">Spec: each defect and a reject target</text>
    <circle cx="130" cy="639" r="26" fill="#1F5FAE"/>
    <text x="130" y="650" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
    <text x="180" y="650" font-size="30" fill="#1F2933">Imaging: calibrate, then freeze it</text>
    <circle cx="130" cy="739" r="26" fill="#1F5FAE"/>
    <text x="130" y="750" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text>
    <text x="180" y="750" font-size="30" fill="#1F2933">Regions: look where defects can be</text>
    <circle cx="130" cy="839" r="26" fill="#1F5FAE"/>
    <text x="130" y="850" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">4</text>
    <text x="180" y="850" font-size="30" fill="#1F2933">Data: collect on the station itself</text>
    <circle cx="130" cy="939" r="26" fill="#1F5FAE"/>
    <text x="130" y="950" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">5</text>
    <text x="180" y="950" font-size="30" fill="#1F2933">Threshold: count good boards rejected</text>
    <line x1="100" y1="1010" x2="980" y2="1010" stroke="#E4E7EB" stroke-width="3"/>
    <rect x="100" y="1070" width="620" height="96" rx="48" fill="#F26522"/>
    <text x="410" y="1131" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">Follow CoreFragment for more</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
