<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <text x="100" y="200" font-size="26" font-weight="700" fill="#1F5FAE">PLAYBOOK · CONNECTED ACCESS CONTROL</text>
    <text x="100" y="340" font-size="76" font-weight="700" fill="#1F2933">The cloud is down.</text>
    <text x="100" y="430" font-size="48" font-weight="700" fill="#1F5FAE">The door still has to decide.</text>
    <!-- diagram: card -> reader (decides) -x- cloud -->
    <rect x="100" y="620" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="4"/>
    <text x="200" y="690" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2933">Smart</text>
    <text x="200" y="728" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2933">card</text>
    <line x1="300" y1="695" x2="400" y2="695" stroke="#1F5FAE" stroke-width="4"/>
    <polygon points="400,683 420,695 400,707" fill="#1F5FAE"/>
    <rect x="420" y="600" width="260" height="190" rx="14" fill="#FDEBD7" stroke="#F26522" stroke-width="5"/>
    <text x="550" y="672" text-anchor="middle" font-size="32" font-weight="700" fill="#1F2933">Reader</text>
    <text x="550" y="716" text-anchor="middle" font-size="26" fill="#1F2933">checks its</text>
    <text x="550" y="750" text-anchor="middle" font-size="26" fill="#1F2933">own list</text>
    <line x1="680" y1="695" x2="780" y2="695" stroke="#52606D" stroke-width="4" stroke-dasharray="12 10"/>
    <line x1="715" y1="675" x2="745" y2="715" stroke="#52606D" stroke-width="5"/>
    <line x1="745" y1="675" x2="715" y2="715" stroke="#52606D" stroke-width="5"/>
    <rect x="780" y="620" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="4"/>
    <text x="880" y="690" text-anchor="middle" font-size="30" font-weight="700" fill="#52606D">Cloud</text>
    <text x="880" y="728" text-anchor="middle" font-size="26" fill="#52606D">offline</text>
    <text x="550" y="850" text-anchor="middle" font-size="28" font-weight="700" fill="#F26522">OPEN or DENY, here</text>
    <line x1="100" y1="930" x2="980" y2="930" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1000" font-size="36" fill="#1F2933">5 decisions for a battery-powered card</text>
    <text x="100" y="1048" font-size="36" fill="#1F2933">reader that reports to the cloud.</text>
    <text x="100" y="1140" font-size="30" font-weight="700" fill="#1F5FAE">Swipe →</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
