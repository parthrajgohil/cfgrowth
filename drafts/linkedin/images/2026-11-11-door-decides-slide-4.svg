<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <circle cx="150" cy="190" r="50" fill="#1F5FAE"/>
    <text x="150" y="208" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">2</text>
    <text x="230" y="200" font-size="28" font-weight="700" fill="#1F5FAE">REVOCATION</text>
    <text x="100" y="360" font-size="72" font-weight="700" fill="#1F2933">How fast must a</text>
    <text x="100" y="450" font-size="72" font-weight="700" fill="#1F5FAE">removed card stop?</text>
    <text x="100" y="540" font-size="34" fill="#1F2933">An offline or sleeping reader still holds</text>
    <text x="100" y="586" font-size="34" fill="#1F2933">yesterday's list. Write the number down:</text>
    <text x="100" y="632" font-size="34" fill="#1F2933">minutes, hours, or the next check-in.</text>
    <!-- version diagram -->
    <rect x="100" y="690" width="260" height="210" rx="14" fill="#1F5FAE"/>
    <text x="230" y="770" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">Cloud list</text>
    <text x="230" y="830" text-anchor="middle" font-size="44" font-weight="700" fill="#FFFFFF">v42</text>
    <line x1="360" y1="795" x2="440" y2="795" stroke="#1F5FAE" stroke-width="4"/>
    <line x1="440" y1="720" x2="440" y2="870" stroke="#1F5FAE" stroke-width="4"/>
    <line x1="440" y1="720" x2="480" y2="720" stroke="#1F5FAE" stroke-width="4"/>
    <line x1="440" y1="795" x2="480" y2="795" stroke="#1F5FAE" stroke-width="4"/>
    <line x1="440" y1="870" x2="480" y2="870" stroke="#1F5FAE" stroke-width="4" stroke-dasharray="10 8"/>
    <rect x="480" y="690" width="500" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="3"/>
    <text x="505" y="730" font-size="28" font-weight="700" fill="#1F2933">Reader A · v42</text>
    <text x="955" y="730" text-anchor="end" font-size="26" fill="#52606D">up to date</text>
    <rect x="480" y="765" width="500" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="3"/>
    <text x="505" y="805" font-size="28" font-weight="700" fill="#1F2933">Reader B · v42</text>
    <text x="955" y="805" text-anchor="end" font-size="26" fill="#52606D">up to date</text>
    <rect x="480" y="840" width="500" height="60" rx="10" fill="#FDEBD7" stroke="#F26522" stroke-width="4"/>
    <text x="505" y="880" font-size="28" font-weight="700" fill="#1F2933">Reader C · v40</text>
    <text x="955" y="880" text-anchor="end" font-size="26" font-weight="700" fill="#F26522">2 behind</text>
    <!-- rules -->
    <circle cx="112" cy="978" r="8" fill="#1F5FAE"/>
    <text x="140" y="990" font-size="32" fill="#1F2933">Version the list; send changes, not all of it.</text>
    <circle cx="112" cy="1048" r="8" fill="#1F5FAE"/>
    <text x="140" y="1060" font-size="32" fill="#1F2933">Each reader reports the version it holds.</text>
    <circle cx="112" cy="1118" r="8" fill="#1F5FAE"/>
    <text x="140" y="1130" font-size="32" fill="#1F2933">Show readers that are behind on the dashboard.</text>
    <!-- footer -->
    <line x1="100" y1="1230" x2="980" y2="1230" stroke="#E4E7EB" stroke-width="3"/>
    <text x="100" y="1290" font-size="26" fill="#52606D">corefragment.com</text>
    <image href="{{LOGO}}" x="664" y="1252" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="980" y="1296" text-anchor="end" font-size="34" font-weight="700" fill="#1F2933">CoreFragment</text>
  </g>
</svg>
